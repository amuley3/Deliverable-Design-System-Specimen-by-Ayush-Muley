<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Notes</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <header>
    <h1>Notes</h1>
    <p>Stories from around town.</p>
  </header>

  <main>
    <article class="card">
      <h2>Hello World</h2>
      <p>This is a small publication.</p>
      <p>New <code>stories</code> are published each week.</p>
      <p><a href="#">Read more</a></p>
    </article>

    <article class="card">
      <h2>More Notes</h2>
      <h3>Topics</h3>
      <ul>
        <li>News</li>
        <li>Events</li>
        <li>Community</li>
      </ul>

      <article class="raised">
        <h3>Editor's Note</h3>
        <p>Small stories.</p>
      </article>

      <article class="notice">
        <p>Coming soon.</p>
      </article>

      <article class="media">
        <p>Media</p>
      </article>
    </article>

    <article class="card">
      <h2>Actions</h2>
      <a href="#">Subscribe</a>
      <button class="primary">Subscribe</button>
      <button class="secondary">Learn More</button>
      <button class="primary" disabled>Unavailable</button>
    </article>

    <article class="card">
      <h2>Subscribe</h2>
      <label for="name">Name</label>
      <input id="name" type="text">

      <label for="topic">Frequency</label>
      <select id="topic">
        <option>Weekly</option>
        <option>Monthly</option>
      </select>

      <label><input type="checkbox"> Email updates</label>
      <label><input type="radio" name="format"> Email</label>
      <label><input type="radio" name="format"> Website</label>
    </article>
  </main>

  <footer>
    <p>Notes</p>
  </footer>
</body>
</html>
